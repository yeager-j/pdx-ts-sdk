    if (anchor === null) return;
    var pointer = toSvg(event);
    vb.x -= pointer.x - anchor.x;
    vb.y -= pointer.y - anchor.y;
  });
  svg.addEventListener("pointerup", function (event) {
    anchor = null;
    svg.releasePointerCapture(event.pointerId);
  });
