version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # TypeScript 7 is the native compiler and ships no JS API. This repo
      # compiles through the API, and the golden-project harness spawns
      # node_modules/typescript/lib/tsc.js directly. Take a TypeScript major
      # deliberately, once it exposes an API, not from a bot PR.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
