# Hermetic on purpose: every step runs from committed inputs — vendored CWT
# rules, the committed corpus fixture, generated output in-tree. The
# install-gated gates (corpus:check, codegen:vanilla:check) are maintainer-local
# and are deliberately absent: a runner has no Stellaris install, and AGENTS.md
# is explicit that neither may be made to pass vacuously without one. The
# install-gated test suites skip themselves, and the corpus version canary is
# silent when no install exists.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-codegen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run codegen:verified-build:check
      # The CI-style codegen drift gate: regenerates from vendored inputs and
      # fails on any diff against the committed packages/sdk/src/generated.
      - run: npm run codegen:check

  tests:
    strategy:
      # One platform's failure is signal about that platform, not about the
      # other legs; let them finish.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22, 24]
        include:
          - os: windows-latest
            node: 24
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:asset-scale

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@v4
        with:
          path: packages/docs-site/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('packages/docs-site/**/*.ts', 'packages/docs-site/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-
      - run: npm ci
      # The docs drift gate (SDK-185): every paired example typechecks against
      # the workspace SDK, compiles through the Fold, and renders. A broken
      # example fails this build.
      #
      # Running `npm run clean` is half the gate, so it happens in this step
      # rather than a neighbouring one. The site must resolve the workspace packages
      # to their sources (SDK-214), and an empty tree is what proves it; with
      # `dist/` on disk the coverage and example gates can check compiled
      # output instead of the sources under review, silently, as they did
      # before. Keep the deletion inside this job so later edits cannot make
      # the source-tree guarantee depend on another job's filesystem.
      - name: Docs gate, against sources rather than dist/
        run: npm run clean && npm run docs:build

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
