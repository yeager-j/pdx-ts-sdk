# Hermetic on purpose: every step runs from committed inputs — vendored CWT
# rules, the committed corpus fixture, generated output in-tree. The
# install-gated gates (corpus:check, codegen:vanilla:check) are maintainer-local
# and are deliberately absent: a runner has no Stellaris install, and AGENTS.md
# is explicit that neither may be made to pass vacuously without one. The
# install-gated test suites skip themselves, and the corpus version canary is
# silent when no install exists.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Must run before build: build refreshes the generated module, whereas
      # this proves package.json's version was committed into the source tree.
      - run: npm run codegen:scaffolder-version:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:asset-scale
      - run: npm run build
      # The docs drift gate (SDK-185): every paired example typechecks against
      # the workspace SDK, compiles through the Fold, and renders. A broken
      # example fails this build. The workspace sweep above also runs it, but
      # only incidentally; this step is the wiring that survives sweep changes.
      - run: npm run docs:build
      - run: npm run codegen:verified-build:check
      # The CI-style codegen drift gate: regenerates from vendored inputs and
      # fails on any diff against the committed packages/sdk/src/generated.
      - run: npm run codegen:check
