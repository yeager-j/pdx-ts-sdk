# Publishing requires npm Trusted Publishing to be configured for these packages on npmjs.com.
# This workflow does not use an NPM_TOKEN secret; npm authenticates the job through OIDC.
# @pdx-ts/stellaris-ids is deliberately not published here. It follows the game build's
# version cadence and needs a Stellaris install to regenerate, so it stays maintainer-published
# (see scripts/release.mjs).
# Maintainers run `npm run release:prepare <version>` and `npm run release:check` locally before tagging.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify tag matches SDK version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          tag_version="${TAG_NAME#v}"
          package_version="$(node -p "require('./packages/sdk/package.json').version")"
          if [ "$tag_version" != "$package_version" ]; then
            echo "::error::Tag ${TAG_NAME} does not match packages/sdk/package.json version ${package_version}."
            exit 1
          fi
      - run: npm run typecheck
      - run: npm test
      - run: npm run codegen:verified-build:check
      - run: npm run codegen:check
      - run: npm run build
      - run: npm publish --workspace create-stellaris-mod --provenance --access public
      - run: npm publish --workspace @pdx-ts/pdxscript --provenance --access public
      - run: npm publish --workspace @pdx-ts/sdk --provenance --access public
      - run: npm publish --workspace @pdx-ts/sdk-testing --provenance --access public
